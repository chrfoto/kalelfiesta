<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Cumpleaños de Kalel!</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        body { margin: 0; overflow-x: hidden; background-color: #3b82f6; font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .font-blippi { font-family: 'Fredoka', sans-serif; }
        .text-blippi-orange { color: #F96302; }
        .bg-blippi-orange { background-color: #F96302; }
        .text-blippi-blue { color: #2C75FF; }
        .bg-blippi-blue { background-color: #2C75FF; }
        .border-blippi-orange { border-color: #F96302; }
        .border-blippi-blue { border-color: #2C75FF; }

        .pattern-dots { background-image: radial-gradient(#ffffff 20%, transparent 20%); background-size: 20px 20px; opacity: 0.2; }
        .caution-tape { background: repeating-linear-gradient(45deg, #F96302, #F96302 10px, #000 10px, #000 20px); }
        
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
        
        @keyframes float-icons { 
            0% { transform: translateY(0) rotate(0deg); } 
            50% { transform: translateY(-20px) rotate(5deg); } 
            100% { transform: translateY(0) rotate(0deg); } 
        }
        .floating-obj { position: absolute; animation: float-icons 6s infinite ease-in-out; pointer-events: none; z-index: 0; }
        
        /* Animación específica para el avión cruzando */
        @keyframes fly-across { 0% { transform: translateX(-20vw) translateY(0) rotate(15deg); } 100% { transform: translateX(120vw) translateY(-50px) rotate(15deg); } }
        .flying-plane { position: absolute; animation: fly-across 20s linear infinite; pointer-events: none; z-index: 0; }

        /* Animación para el coche cruzando abajo */
        @keyframes drive-across { 0% { transform: translateX(-20vw); } 100% { transform: translateX(120vw); } }
        .driving-car { position: absolute; animation: drive-across 15s linear infinite; pointer-events: none; z-index: 0; bottom: 5%; }

        @keyframes float-bubble { 0% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(10px, -15px) rotate(2deg); } 66% { transform: translate(-5px, 10px) rotate(-2deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .bubble-photo { position: absolute; animation: float-bubble 8s infinite ease-in-out; z-index: 0; border-radius: 9999px; border: 4px solid white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); overflow: hidden; object-fit: cover; }
        
        /* Clase para las imágenes PNG de vehículos */
        .vehicle-img {
            width: 100%;
            height: auto;
            display: block; /* Asegura que no se comporte como texto */
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG MANUALES ---
        const Icons = {
            HardHat: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a6 6 0 0 1 6-6h0"/><path d="M14 6h0a6 6 0 0 1 6 6v3"/></svg>,
            Truck: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>,
            Wrench: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
            Hammer: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25V7.86c0-.55-.45-1-1-1H16.4c-.84 0-1.65-.33-2.25-.93L12.9 4.64a1 1 0 0 0-1.42 0L9.32 6.8c-.6.6-.92 1.4-.92 2.25v.36c0 .55.45 1 1 1H10c.84 0 1.65.33 2.25.93l1.25 1.25a1 1 0 0 1 0 1.42l-1.84 1.84a1 1 0 0 0 0 1.42l2.82 2.82c.39.39 1.02.39 1.42 0l1.84-1.84a1 1 0 0 1 1.42 0z"/></svg>,
            Cone: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m10.958 3.008 8.96 17.032a1 1 0 0 1-.885 1.465H4.968a1 1 0 0 1-.885-1.465l8.96-17.032a1 1 0 0 1 1.77 0Z"/><path d="M7 17h10"/><path d="M9.5 13h5"/></svg>,
            Settings: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            TriangleAlert: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            CircleDot: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg>,
            Calendar: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Clock: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            MapPin: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            MessageCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>,
            Music: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Play: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>,
            CheckCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        };

        function InvitacionKalel() {
            // --- DATOS ---
            const fotoCumpleanero = "https://i.imgur.com/i5Tftdu.jpg"; 
            const fotosBurbuja = [
                "https://i.imgur.com/LQ6IFnW.jpg",
                "https://i.imgur.com/atae7WD.jpg",
                "https://i.imgur.com/HFR6OsL.jpg",
                "https://i.imgur.com/rnz1VSF.jpg"
            ];
            
            // --- IMÁGENES DE VEHÍCULOS (Enlaces actualizados y más estables) ---
            const vehiculos = {
                // Usamos Iconos de color plano que cargan mejor y se ven como stickers
                excavadora: "https://img.icons8.com/color/144/excavator.png",
                camion: "https://img.icons8.com/color/144/dump-truck.png",
                mezcladora: "https://img.icons8.com/color/144/concrete-mixer.png",
                grua: "https://img.icons8.com/color/144/crane.png",
                avion: "https://img.icons8.com/color/144/airplane-take-off.png",
                coche: "https://img.icons8.com/color/144/fiat-500.png" 
            };

            const videoIntro = "https://i.imgur.com/z7mDcNh.mp4";
            const musicaFondo = "https://media.vocaroo.com/mp3/12dEuflncujS"; 
            
            // --- ESTADOS ---
            const [rsvpOpen, setRsvpOpen] = useState(false);
            const [formSubmitted, setFormSubmitted] = useState(false);
            const [guestName, setGuestName] = useState('');
            const [isPlaying, setIsPlaying] = useState(false);
            const [showVideoIntro, setShowVideoIntro] = useState(true);
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            
            const audioRef = useRef(null);
            const videoRef = useRef(null);

            // Auto-play Video
            useEffect(() => {
                if (showVideoIntro && videoRef.current) {
                    const playPromise = videoRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Autoplay bloqueado (normal en móviles):", error);
                        });
                    }
                }
            }, [showVideoIntro]);

            // Cuenta Regresiva
            useEffect(() => {
                const eventDate = new Date('2026-02-15T16:00:00'); 
                const timer = setInterval(() => {
                    const now = new Date();
                    const difference = eventDate - now;
                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((difference / 1000 / 60) % 60),
                            seconds: Math.floor((difference / 1000) % 60),
                        });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const toggleMusic = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                    } else {
                        audioRef.current.play();
                    }
                    setIsPlaying(!isPlaying);
                }
            };

            const enterParty = () => {
                if (videoRef.current) videoRef.current.pause();
                setShowVideoIntro(false);
                if (audioRef.current) {
                    audioRef.current.volume = 0.5;
                    audioRef.current.play().catch(e => console.log("Audio autoplay prevented"));
                    setIsPlaying(true);
                }
            };

            const handleRSVP = (e) => {
                e.preventDefault();
                if (guestName.trim()) {
                    setFormSubmitted(true);
                    const telefono = "524436853800";
                    const mensaje = `Hola, soy *${guestName}* y confirmo mi asistencia al cumple número 4 de Kalel 🚧🚜. ¡Ahí nos vemos!`;
                    const urlWhatsapp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
                    setTimeout(() => {
                        window.open(urlWhatsapp, '_blank');
                        setRsvpOpen(false);
                        setGuestName('');
                        setFormSubmitted(false);
                    }, 1500);
                }
            };

            return (
                <div className="min-h-screen bg-blue-500 font-sans relative overflow-x-hidden selection:bg-[#F96302] selection:text-white">
                    <audio ref={audioRef} loop>
                        <source src={musicaFondo} type="audio/mpeg" />
                    </audio>

                    {/* VIDEO INTRO */}
                    {showVideoIntro && (
                        <div className="fixed inset-0 z-50 bg-blippi-blue flex flex-col items-center justify-between p-0 animate-fade-in overflow-hidden h-[100dvh]">
                            <div className="absolute top-0 left-0 right-0 z-20 p-4 bg-gradient-to-b from-black/50 to-transparent pt-6 pointer-events-none">
                                <div className="flex justify-center items-center gap-2 mb-1">
                                    <Icons.HardHat className="text-blippi-orange drop-shadow-md" size={32} />
                                </div>
                                <h1 className="font-blippi text-2xl font-bold text-white text-center drop-shadow-md">¡HOLA AMIGOS!</h1>
                                <p className="font-blippi text-white/90 text-sm text-center drop-shadow-sm">Mira un mensaje especial...</p>
                            </div>
                            <div className="relative w-full h-full bg-black flex items-center justify-center">
                                <video ref={videoRef} className="w-full h-full object-cover" src={videoIntro} controls autoPlay playsInline poster={fotoCumpleanero} style={{ maxHeight: '100dvh' }}>
                                    Tu navegador no soporta este video.
                                </video>
                            </div>
                            <div className="absolute bottom-0 left-0 right-0 z-30 p-8 pb-12 flex justify-center bg-gradient-to-t from-black/80 to-transparent pointer-events-none">
                                <button onClick={enterParty} className="pointer-events-auto w-full max-w-xs bg-blippi-orange text-white font-blippi font-bold text-2xl py-4 rounded-full shadow-[0_4px_0_rgb(180,60,0)] active:shadow-none active:translate-y-1 transition-all flex items-center justify-center gap-2 animate-bounce-slow border-4 border-white transform hover:scale-105">
                                    <span>¡VAMOS A JUGAR!</span><Icons.Truck fill="white" size={28}/>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* INVITACIÓN PRINCIPAL */}
                    <div className={`relative min-h-screen pb-12 transition-opacity duration-1000 ${showVideoIntro ? 'opacity-0 hidden' : 'opacity-100'}`}>
                        <div className="absolute inset-0 pattern-dots pointer-events-none"></div>

                        {/* FOTOS FLOTANTES */}
                        <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                            <div className="bubble-photo left-[-10px] top-[10%] w-20 h-20 sm:w-28 sm:h-28 rotate-[-5deg] border-blippi-orange" style={{animationDelay: '0s'}}><img src={fotosBurbuja[0]} alt="K1" className="w-full h-full object-cover" /></div>
                            <div className="bubble-photo right-[-15px] top-[22%] w-22 h-22 sm:w-32 sm:h-32 rotate-[5deg] border-blippi-blue" style={{animationDelay: '2s'}}><img src={fotosBurbuja[1]} alt="K2" className="w-full h-full object-cover" /></div>
                            <div className="bubble-photo left-[-10px] top-[55%] w-20 h-20 sm:w-28 sm:h-28 rotate-[-3deg] border-yellow-400" style={{animationDelay: '4s'}}><img src={fotosBurbuja[2]} alt="K3" className="w-full h-full object-cover" /></div>
                            <div className="bubble-photo right-[-10px] top-[75%] w-24 h-24 sm:w-32 sm:h-32 rotate-[6deg] border-blippi-orange" style={{animationDelay: '1s'}}><img src={fotosBurbuja[3]} alt="K4" className="w-full h-full object-cover" /></div>
                        </div>

                        {/* FONDO ANIMADO CON IMÁGENES REALES (PNG) */}
                        <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                            {/* Excavadora (Arriba Izquierda) */}
                            <div className="floating-obj left-[-20px] top-[28%] w-32 sm:w-48 opacity-80" style={{animationDelay: '0s'}}>
                                <img src={vehiculos.excavadora} className="vehicle-img" alt="Excavadora" onError={(e) => e.target.style.display = 'none'} />
                            </div>
                            
                            {/* Grúa (Arriba Derecha) */}
                            <div className="floating-obj right-[-30px] top-[45%] w-32 sm:w-48 opacity-80" style={{animationDelay: '2s'}}>
                                <img src={vehiculos.grua} className="vehicle-img" alt="Grúa" onError={(e) => e.target.style.display = 'none'} />
                            </div>

                            {/* Camión de Volteo (Abajo Izquierda) */}
                            <div className="floating-obj left-[30%] bottom-[5%] w-40 sm:w-56 opacity-70" style={{animationDelay: '4s'}}>
                                <img src={vehiculos.camion} className="vehicle-img" alt="Camión" onError={(e) => e.target.style.display = 'none'} />
                            </div>

                            {/* Coche Rojo (Cruzando abajo) */}
                            <div className="driving-car w-32 sm:w-48 opacity-90">
                                <img src={vehiculos.coche} className="vehicle-img" alt="Coche" onError={(e) => e.target.style.display = 'none'} />
                            </div>

                            {/* Avión (Volando arriba) */}
                            <div className="flying-plane top-[5%] w-32 sm:w-40 opacity-80">
                                <img src={vehiculos.avion} className="vehicle-img" alt="Avión" onError={(e) => e.target.style.display = 'none'} />
                            </div>

                            {/* Mezcladora (Extra) */}
                            <div className="floating-obj right-[-10px] bottom-[25%] w-28 sm:w-40 opacity-70" style={{animationDelay: '1.5s'}}>
                                <img src={vehiculos.mezcladora} className="vehicle-img" alt="Mezcladora" onError={(e) => e.target.style.display = 'none'} />
                            </div>
                        </div>

                        <div className="caution-tape h-6 w-full sticky top-0 z-20 border-b-2 border-white"></div>
                        <div className="bg-white h-4 w-full sticky top-6 z-20 shadow-sm"></div>

                        <div className="max-w-md mx-auto relative z-10 px-4 pt-6">
                            {/* HEADER */}
                            <div className="text-center mb-6 mt-4">
                                <div className="inline-block relative">
                                    <div className="absolute -top-6 -right-6 animate-bounce-slow">
                                        <div className="bg-yellow-400 p-3 rounded-full border-4 border-white shadow-md transform rotate-12">
                                            <Icons.Truck size={36} className="text-blippi-blue" strokeWidth={2.5} />
                                        </div>
                                    </div>
                                    <div className="flex justify-center mb-2">
                                        <div className="relative transform scale-125">
                                            <div className="w-0 h-0 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent border-b-[40px] border-b-[#F96302] rotate-90 inline-block mr-[-10px]"></div>
                                            <div className="bg-[#F96302] w-6 h-6 rounded-full inline-block relative z-10"></div>
                                            <div className="w-0 h-0 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent border-b-[40px] border-b-[#F96302] -rotate-90 inline-block ml-[-10px]"></div>
                                        </div>
                                    </div>
                                </div>
                                <h2 className="font-blippi text-white text-3xl font-bold drop-shadow-md mt-4 flex items-center justify-center gap-2">
                                    <Icons.Wrench size={24} className="text-yellow-300" /> ¡ES EL CUMPLE DE! <Icons.Hammer size={24} className="text-yellow-300 transform scale-x-[-1]" />
                                </h2>
                                <h1 className="font-blippi text-7xl text-white font-black drop-shadow-[4px_4px_0_rgba(249,99,2,1)] mt-2 tracking-wide transform -rotate-2">KALEL</h1>
                                <div className="mt-8 mb-6 flex justify-center">
                                    <div className="relative w-56 h-56">
                                        <div className="absolute inset-0 bg-blippi-orange rounded-full transform rotate-3 scale-105 border-4 border-white shadow-lg"></div>
                                        <div className="absolute inset-0 bg-blippi-blue rounded-full transform -rotate-2 scale-100 border-4 border-white shadow-lg overflow-hidden">
                                            <img src={fotoCumpleanero} alt="Cumpleañero" className="w-full h-full object-cover" />
                                        </div>
                                        <div className="absolute -bottom-2 -right-2 bg-yellow-400 p-3 rounded-full border-4 border-white shadow-sm z-10 transform rotate-12">
                                            <Icons.Cone size={32} className="text-blippi-blue fill-blippi-orange" />
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white inline-block px-8 py-2 rounded-full mt-2 transform rotate-1 shadow-lg border-2 border-blippi-blue">
                                    <span className="font-blippi text-blippi-blue font-bold text-3xl">¡CUMPLE 4 AÑOS!</span>
                                </div>
                            </div>

                            {/* COUNTDOWN */}
                            <div className="bg-blippi-orange rounded-3xl p-6 shadow-lg border-4 border-white mb-8 text-center text-white relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full bg-white opacity-10 pattern-dots"></div>
                                <div className="absolute top-2 right-2 opacity-50"><Icons.TriangleAlert size={24} color="white" /></div>
                                <p className="font-blippi font-bold text-xl mb-3 relative z-10 flex items-center justify-center gap-2">
                                    <Icons.Truck size={20} /> LA DIVERSIÓN COMIENZA EN:
                                </p>
                                <div className="flex justify-center gap-2 relative z-10">
                                    {[{l:'DÍAS',v:timeLeft.days}, {l:'HRS',v:timeLeft.hours}, {l:'MIN',v:timeLeft.minutes}, {l:'SEG',v:timeLeft.seconds}].map((item, idx) => (
                                        <div key={idx} className="flex flex-col items-center flex-1">
                                            <div className="bg-white w-full aspect-square rounded-2xl flex items-center justify-center shadow-sm mb-1 border-b-4 border-gray-200">
                                                <span className="font-blippi text-blippi-blue font-bold text-2xl sm:text-3xl">{item.v}</span>
                                            </div>
                                            <span className="text-xs font-bold opacity-90 tracking-wider">{item.l}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* INFO CARD */}
                            <div className="bg-white rounded-[2rem] p-6 shadow-xl border-b-8 border-blippi-blue mb-8 relative overflow-hidden">
                                <div className="text-center mb-6 relative z-10">
                                    <p className="font-blippi text-2xl text-gray-700 leading-tight">
                                        ¡Abróchate el cinturón! Habrá juegos, <span className="text-blippi-blue font-bold">mucho baile</span> y nos vamos a divertir mucho.
                                    </p>
                                </div>
                                <div className="space-y-6 relative z-10">
                                    <div className="flex items-center gap-4 bg-blue-50 p-4 rounded-2xl border-2 border-blue-100">
                                        <div className="bg-blippi-blue p-3 rounded-full shrink-0"><Icons.Calendar className="text-white" size={28} /></div>
                                        <div><p className="font-blippi text-gray-500 text-sm font-bold uppercase tracking-wider">¿Cuándo?</p><p className="font-blippi text-blippi-blue text-2xl font-bold">15 de Febrero</p></div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-orange-50 p-4 rounded-2xl border-2 border-orange-100">
                                        <div className="bg-blippi-orange p-3 rounded-full shrink-0"><Icons.Clock className="text-white" size={28} /></div>
                                        <div><p className="font-blippi text-gray-500 text-sm font-bold uppercase tracking-wider">Hora</p><p className="font-blippi text-blippi-orange text-2xl font-bold">4:00 - 10:00 PM</p></div>
                                    </div>
                                    <div className="flex items-center gap-4 bg-blue-50 p-4 rounded-2xl border-2 border-blue-100">
                                        <div className="bg-blippi-blue p-3 rounded-full shrink-0"><Icons.MapPin className="text-white" size={28} /></div>
                                        <div className="flex-1 min-w-0">
                                            <p className="font-blippi text-gray-500 text-sm font-bold uppercase tracking-wider">Lugar de la Fiesta</p>
                                            <p className="font-blippi text-blippi-blue text-xl font-bold leading-tight truncate">Salón Santa Bárbara</p>
                                            <a href="https://maps.app.goo.gl/VCwWR67ZTpjwADVJ6" target="_blank" rel="noreferrer" className="text-blippi-orange text-base font-bold underline mt-1 block hover:text-orange-600">Ver Ubicación en Mapa</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* BUTTONS */}
                            <div className="space-y-4 pb-12 relative z-10">
                                <div className="bg-yellow-50 border-2 border-blippi-orange/30 p-4 rounded-2xl mb-2 text-center shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-2 h-full bg-blippi-orange"></div>
                                    <div className="flex items-center justify-center gap-2 mb-1">
                                        <Icons.TriangleAlert className="text-blippi-orange" size={20} />
                                        <p className="font-blippi font-bold text-blippi-orange text-lg">AVISO IMPORTANTE</p>
                                    </div>
                                    <p className="font-blippi text-gray-700 text-sm leading-tight">
                                        Por favor confirma solo si estás <span className="font-bold text-blippi-blue">100% SEGURO</span> de asistir para preparar tu sorpresa.
                                    </p>
                                </div>

                                <button onClick={() => setRsvpOpen(true)} className="w-full bg-blippi-orange hover:bg-orange-600 text-white font-blippi font-bold text-2xl py-5 rounded-full shadow-[0_6px_0_rgb(180,60,0)] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-3">
                                    <Icons.CheckCircle size={28} /> CONFIRMAR ASISTENCIA
                                </button>
                                
                                <a href="https://maps.app.goo.gl/VCwWR67ZTpjwADVJ6" target="_blank" rel="noreferrer" className="w-full bg-white hover:bg-gray-50 text-blippi-blue font-blippi font-bold text-xl py-4 rounded-full shadow-md border-4 border-blippi-blue flex items-center justify-center gap-2 block text-center">
                                    <Icons.MapPin size={24} /> CÓMO LLEGAR
                                </a>
                            </div>
                        </div>

                        {!showVideoIntro && (
                            <button onClick={toggleMusic} className="fixed bottom-6 right-6 bg-white p-4 rounded-full shadow-xl border-4 border-blippi-blue z-40 animate-bounce-slow active:scale-95 transition-transform">{isPlaying ? <Icons.Music className="text-blippi-orange animate-pulse" size={28} /> : <Icons.Play className="text-gray-400" size={28} />}</button>
                        )}

                        {rsvpOpen && (
                            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4">
                                <div className="absolute inset-0 bg-blippi-blue/90 backdrop-blur-md" onClick={() => setRsvpOpen(false)}></div>
                                <div className="bg-white rounded-t-[2rem] sm:rounded-3xl w-full max-w-sm p-8 relative z-10 shadow-2xl animate-[float_0.5s_ease-out] border-t-8 sm:border-8 border-blippi-orange">
                                    <button onClick={() => setRsvpOpen(false)} className="absolute top-4 right-4 bg-gray-100 text-gray-500 w-10 h-10 rounded-full font-bold flex items-center justify-center hover:bg-gray-200">X</button>
                                    {!formSubmitted ? (
                                        <>
                                            <div className="text-center mb-6 mt-2">
                                                <div className="inline-block bg-orange-100 p-4 rounded-full mb-3"><Icons.Truck className="text-blippi-orange" size={40} /></div>
                                                <h3 className="font-blippi text-3xl font-bold text-gray-800">¿Estás listo para la acción?</h3>
                                                <p className="text-gray-600 font-blippi text-lg leading-tight mt-2">Confirma tu asistencia para esperarte con alegría.</p>
                                            </div>
                                            <form onSubmit={handleRSVP} className="space-y-5">
                                                <div><label className="block font-blippi font-bold text-sm text-gray-500 mb-2 uppercase tracking-wide">Tu Nombre</label><input type="text" required value={guestName} onChange={(e) => setGuestName(e.target.value)} className="w-full border-4 border-gray-100 rounded-2xl p-4 font-blippi text-lg focus:border-blippi-orange focus:outline-none transition-colors bg-gray-50" placeholder="Escribe tu nombre aquí..." /></div>
                                                <button type="submit" className="w-full bg-blippi-blue text-white font-blippi font-bold text-2xl py-4 rounded-2xl hover:bg-blue-600 shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2"><span>¡ENVIAR CONFIRMACIÓN!</span> <Icons.MessageCircle size={24} className="fill-current"/></button>
                                            </form>
                                        </>
                                    ) : (
                                        <div className="text-center py-12">
                                            <div className="flex justify-center mb-6"><div className="bg-green-100 p-6 rounded-full animate-bounce"><Icons.HardHat size={64} className="text-green-500" /></div></div>
                                            <h3 className="font-blippi text-3xl font-bold text-gray-800 mb-3">¡GENIAL!</h3>
                                            <p className="font-blippi text-xl text-gray-600">Redirigiendo a WhatsApp...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InvitacionKalel />);
    </script>
</body>
</html>
